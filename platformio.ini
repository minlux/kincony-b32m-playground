; PlatformIO project for the KinCony B32M (ESP32-S3-WROOM-1U N16R8) smart controller
; https://www.kincony.com/esp32-smart-controller-b32m-32ch-mosfet.html

[env:b32m]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; N16R8 module: 16MB flash, 8MB octal PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    robtillaart/PCF8575@^0.3.0
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    arduino-libraries/Ethernet@^2.0.2
